name: Simulation watchdog (starts a missed run)

# GitHub starts scheduled workflows late and sometimes not at all (18 Nov 2026: the 09:23 and 12:23 UTC runs of the
# simulation never started). Twice an hour this workflow looks at when the simulation last started and, when its
# scheduled run is 70 minutes or more overdue and nothing is queued or running, starts it - the same thing the
# "Run workflow" button on the Actions page does. It runs no simulation code, commits nothing and changes nothing in
# the repository. If a run it starts turns out to be a duplicate, that is harmless: the second run finds nothing new.
# GitHub fires this schedule only a few times a day (1 to 4 times in November 2026), so since 28 Nov 2026 the keeper
# (.github/workflows/keeper.yml) does the same check without GitHub's schedule; both use scripts/watchdog_check.sh.
# Paper trading only.
on:
  schedule:
    - cron: "7,37 * * * 1-6"
  workflow_dispatch:
    inputs:
      pretend_last_run:
        description: "Test only: treat this UTC time (like 2026-11-18T07:53:41Z) as the newest successful simulation run"
        required: false
        default: ""
      dry_run:
        description: "Test only: decide and print, start nothing"
        type: boolean
        required: false
        default: false

permissions:
  actions: write     # to start the simulation workflow; nothing else is written
  contents: read

concurrency:
  group: sim-watchdog
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Start the simulation if its scheduled run is overdue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PRETEND_LAST: ${{ inputs.pretend_last_run }}
          DRY_RUN: ${{ inputs.dry_run }}
        # the same check the keeper does (scripts/watchdog_check.sh); it never fails and starts nothing when in doubt
        run: bash scripts/watchdog_check.sh
