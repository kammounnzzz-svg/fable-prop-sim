name: Simulation watchdog (starts a missed run)

# GitHub starts scheduled workflows late and sometimes not at all (18 Nov 2026: the 09:23 and 12:23 UTC runs of the
# simulation never started). Twice an hour this workflow looks at when the simulation last started and, when its
# scheduled run is 70 minutes or more overdue and nothing is queued or running, starts it - the same thing the
# "Run workflow" button on the Actions page does. It runs no simulation code, commits nothing and changes nothing in
# the repository. If a run it starts turns out to be a duplicate, that is harmless: the second run finds nothing new.
# Paper trading only.
on:
  schedule:
    - cron: "7,37 * * * 1-6"
  workflow_dispatch:
    inputs:
      pretend_last_run:
        description: "Test only: treat this UTC time (like 2026-11-18T07:53:41Z) as the newest simulation run"
        required: false
        default: ""
      dry_run:
        description: "Test only: decide and print, start nothing"
        type: boolean
        required: false
        default: false

permissions:
  actions: write     # to start the simulation workflow; nothing else is written
  contents: read

concurrency:
  group: sim-watchdog
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Start the simulation if its scheduled run is overdue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PRETEND_LAST: ${{ inputs.pretend_last_run }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set +e     # this step must never fail: when anything is unclear it starts nothing and says why
          say() { echo "$1"; echo "$1" >> "$GITHUB_STEP_SUMMARY"; }
          newest=$(gh api "repos/$REPO/actions/workflows/sim.yml/runs?per_page=1" --jq '.workflow_runs[0] | "\(.status) \(.created_at)"' 2>&1)
          if [ $? -ne 0 ] || ! echo "$newest" | grep -Eq '^[a-z_]+ [0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:]{8}Z$'; then
            say "Could not read the simulation's runs (${newest:0:200}). Nothing started."
            exit 0
          fi
          status=${newest%% *}; last=${newest##* }
          if [ -n "$PRETEND_LAST" ]; then
            say "TEST: pretending the newest simulation run started at $PRETEND_LAST (really: $status, started $last)."
            last="$PRETEND_LAST"
          elif [ "$status" != "completed" ]; then
            say "A simulation run is already $status (started $last). Nothing to do."
            exit 0
          fi
          verdict=$(python3 scripts/sim_watchdog.py --last "$last" 2>&1)
          say "Newest simulation run started $last. $verdict"
          case "$verdict" in
            *"start=yes"*)
              if [ "$DRY_RUN" = "true" ]; then
                say "TEST (dry run): the simulation would be started now."
              elif out=$(gh workflow run sim.yml -R "$REPO" --ref main 2>&1); then
                say "The scheduled run is overdue: started the simulation. ${out:0:200}"
              else
                say "The scheduled run is overdue, but the simulation could not be started: ${out:0:300}"
              fi
              ;;
            *)
              say "Nothing to do."
              ;;
          esac
          exit 0
