name: Prop portfolio simulation (paper trading)

# Runs the simulation engine on a fixed schedule: fetch prices, process every account's
# rulebook, export the dashboard datasets, and commit the new state back to this repository.
# No broker, no real orders, no money - a paper-trading simulation only.
on:
  schedule:
    # every 3 hours Mon-Sat at :23 UTC (00:23 UTC is the daily-close run); the :41 line is a second chance
    # in the same window because GitHub sometimes delays or drops a scheduled run - a duplicate run is harmless
    - cron: "23 */3 * * 1-6"
    - cron: "41 */3 * * 1-6"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sim-run
  cancel-in-progress: false

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the repository (the branch's newest commit)
        uses: actions/checkout@v5
        with:
          # The branch, not the commit the run was started on: a run that waited behind another one (concurrency
          # above) then works from the state that run saved. Without it, the run of 26 Nov 2026 19:15 UTC, which had
          # waited 14 seconds, worked from the older commit and could not save its result.
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Run the simulation (fetch bars, run every account, export)
        run: python3 scripts/run_sim.py

      - name: Commit the new state and exports
        if: always()
        env:
          BRANCH: ${{ github.ref_name }}
        # retries GitHub's own push errors, and runs the simulation again on the newest commit when another run
        # saved its result first (scripts/commit_run.sh says how)
        run: bash scripts/commit_run.sh
