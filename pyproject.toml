[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fable-prop-sim"
version = "0.7.1"
description = "Paper-trading simulation engine for prop-firm style accounts (no broker, no real orders)"
requires-python = ">=3.9"

[tool.setuptools]
packages = ["fable_prop_sim"]
